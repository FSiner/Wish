<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>원신 임팩트 가챠 시뮬레이터</title>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"
            }
        }
    </script>
    <style>
        :root { 
            --gold: #ffcc00; --purple: #bf40ff; --blue: #4099ff; 
            --bg: #030712; --radiance: #ff4ef0; --chicken: #ff9f43; 
        }
        body { 
            background-color: var(--bg); color: white; font-family: 'Malgun Gothic', sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box;
            display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;
        }
        
        /* 🌌 5성 등장 전용 극장식 초호화 암전 연출 레이어 */
        .premium-cutscene-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98); z-index: 5000;
            display: none; justify-content: center; align-items: center; flex-direction: column;
            overflow: hidden; pointer-events: auto;
        }
        
        /* 👤 0.5초간 보이다가 터지는 캐릭터 실루엣 */
        .character-silhouette {
            font-size: 5em; font-weight: 900; color: transparent;
            text-shadow: 0 0 40px rgba(255,255,255,0.8);
            position: relative; z-index: 5100; opacity: 0;
            transform: scale(0.9);
            animation: silhouette-pulse 0.6s ease-in-out forwards;
        }
        @keyframes silhouette-pulse {
            0% { opacity: 0; transform: scale(0.85); filter: blur(5px); }
            30% { opacity: 1; filter: blur(2px); }
            80% { opacity: 1; transform: scale(1.02); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.1); }
        }

        /* ✨ 파편/결정 스파크 이펙트 */
        .crystal-particle {
            position: absolute; width: 12px; height: 12px; background: #fff;
            transform: rotate(45deg); pointer-events: none; z-index: 5200;
            box-shadow: 0 0 10px #fff;
        }
        @keyframes scatter-pickup {
            0% { transform: translate(0, 0) rotate(45deg) scale(1); opacity: 1; background: var(--gold); box-shadow: 0 0 15px var(--gold); }
            100% { transform: translate(var(--x), var(--y)) rotate(360deg) scale(0); opacity: 0; }
        }
        @keyframes scatter-standard {
            0% { transform: translate(0, 0) rotate(45deg) scale(1); opacity: 1; background: var(--blue); box-shadow: 0 0 15px var(--blue); }
            100% { transform: translate(var(--x), var(--y)) rotate(360deg) scale(0); opacity: 0; }
        }

        /* 👑 최종 캐릭터 공개 화면 테마 */
        .reveal-card-display {
            position: relative; z-index: 5300; text-align: center; opacity: 0;
            transform: scale(0.7); display: flex; flex-direction: column; align-items: center;
        }
        .reveal-card-display.pop-open {
            animation: card-pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes card-pop-in {
            to { opacity: 1; transform: scale(1); }
        }

        .showcase-frame {
            width: 280px; height: 420px; border-radius: 16px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 3px solid #fff; box-shadow: 0 0 40px rgba(255,255,255,0.4);
            margin-bottom: 20px; position: relative;
        }
        .bg-pickup-reveal {
            background: radial-gradient(circle, #3a2800 0%, #150f00 70%, #000 100%);
            border-color: var(--gold) !important;
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.5), inset 0 0 30px rgba(255,204,0,0.3) !important;
        }
        .bg-standard-reveal {
            background: radial-gradient(circle, #0f1e36 0%, #060d1a 70%, #000 100%);
            border-color: var(--blue) !important;
            box-shadow: 0 0 40px rgba(64, 153, 255, 0.4), inset 0 0 20px rgba(64,153,255,0.2) !important;
        }
        
        .reveal-btn {
            background: #fff; color: #000; padding: 12px 40px; border-radius: 50px;
            font-weight: bold; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        /* 기본 구조 레이아웃 */
        .name-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 21, 0.95); z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }
        .name-modal-box {
            background: #111827; border: 2px solid var(--gold); padding: 30px;
            border-radius: 20px; text-align: center; width: 350px;
        }
        .name-modal-box input {
            width: 80%; background: #222; border: 1px solid #444; color: white;
            padding: 10px; border-radius: 8px; font-size: 1em; text-align: center; margin-bottom: 20px;
        }
        .name-modal-box button { width: 88%; padding: 10px; border-radius: 8px; font-size: 1em; background: var(--gold); font-weight: bold; border: none; cursor: pointer; }

        .wrapper { width: 100%; max-width: 1550px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .main-layout { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; width: 100%; align-items: start; }
        
        .container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .side-panel { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        .panel-box { background: rgba(10, 15, 25, 0.9); border: 1px solid #232d3f; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; box-sizing: border-box; }
        .history-list, .rank-list, .room-user-list { flex-grow: 1; overflow-y: auto; font-size: 0.85em; max-height: 160px; min-height: 120px; padding-right: 5px; }

        .dashboard { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; }
        .stat { background: rgba(26, 29, 40, 0.8); padding: 12px 8px; border-radius: 12px; border: 1px solid #253147; text-align: center; box-sizing: border-box; }
        .stat span { display: block; font-size: 0.75em; color: #888; margin-bottom: 5px; }
        .stat b { font-size: 1.1em; color: var(--gold); }

        .wish-stage { 
            position: relative; width: 100%; min-height: 480px; height: 480px;
            background: radial-gradient(circle at center, #111b29 0%, #040812 100%); 
            border-radius: 20px; display: flex; justify-content: center; align-items: center; 
            gap: 10px; padding: 20px; border: 1px solid #253346; overflow: hidden; box-sizing: border-box;
        }
        
        #effect-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        
        .shooting-star { width: 20px; height: 600px; position: absolute; top: -700px; left: -10%; border-radius: 100px; opacity: 0; transform: rotate(-45deg); background: linear-gradient(to bottom, transparent, #fff, #99ccff); box-shadow: 0 0 40px #4099ff; z-index: 200; }
        .star-3 { animation: genshin-fall-3 1.5s ease-in-out forwards; }
        .star-4 { animation: genshin-fall-4 2.2s ease-in-out forwards; }
        .star-5 { animation: genshin-fall-5 2.8s ease-in-out forwards; }

        @keyframes genshin-fall-3 { 0% { transform: translate(0,0) rotate(-45deg); opacity:0; } 100% { transform: translate(1400px,1400px) rotate(-45deg); opacity:0; } }
        @keyframes genshin-fall-4 { 0% { transform: translate(0,0) rotate(-45deg); opacity:0; } 15% { opacity:1; } 100% { transform: translate(1400px,1400px) rotate(-45deg); opacity:0; } }
        @keyframes genshin-fall-5 { 0% { transform: translate(0,0) rotate(-45deg); opacity:0; } 15% { opacity:1; } 100% { transform: translate(1400px,1400px) rotate(-45deg); opacity:0; } }

        .card { width: 9%; max-width: 105px; aspect-ratio: 9/16; perspective: 1000px; cursor: pointer; opacity: 0; z-index: 50; }
        .card.active { opacity: 1; transition: 0.15s ease-out; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.25s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; }
        .card-back { background: #1e2230; border: 1px solid #334460; }
        .card-front { transform: rotateY(180deg); color: #000; font-weight: bold; text-align: center; display: flex; flex-direction: column; justify-content: center; font-size: 0.8em; }
        .res-5 { background: linear-gradient(145deg, #ffcc00, #fff); box-shadow: 0 0 20px #ffcc00; }
        .res-4 { background: linear-gradient(145deg, #bf40ff, #fff); }
        .res-3 { background: #3d4a5d; color: white; }

        .controls { display: flex; gap: 15px; justify-content: center; margin-top: 5px; width: 100%; }
        button { padding: 12px 30px; border: none; border-radius: 50px; font-weight: bold; font-size: 1em; cursor: pointer; background: var(--gold); color:#111; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button:disabled { background: #333 !important; color: #777 !important; cursor: not-allowed; }
        .btn-skip { background: #222530; color: white; border: 1px solid #445; display: none; }
        
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; }
        .input-group input { flex: 1; background: #1a1f2c; border: 1px solid #3a4b66; color: white; padding: 8px; border-radius: 5px; }
        .room-user-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1f2736; font-size: 0.9em; }
        
        /* 💎 도감 대신 들어간 원석 저장고 UI */
        .gem-storage-panel { background: rgba(13, 18, 30, 0.9); border: 1px solid #1e293b; border-radius: 15px; padding: 20px; text-align: center; box-sizing: border-box; }
        .gem-flex { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 15px; }
        .gem-box { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 12px 25px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        /* CSS 가상 원석 비주얼 아이콘 */
        .primogem-icon {
            width: 24px; height: 24px; background: #8ec5fc;
            clip-path: polygon(50% 0%, 85% 35%, 50% 100%, 15% 35%);
            box-shadow: 0 0 10px #8ec5fc; display: inline-block;
            background: radial-gradient(circle, #e0f2fe 0%, #38bdf8 70%);
        }
        #gameStatusAlert { text-align: center; color: #5bc0de; font-weight: bold; margin-bottom: 5px; font-size: 0.85em; }
    </style>
</head>
<body>

<div id="premiumCutscene" class="premium-cutscene-overlay">
    <div id="silhouetteActor" class="character-silhouette">👤</div>
    <div id="revealActor" class="reveal-card-display">
        <div id="showcaseFrame" class="showcase-frame">
            <div style="font-size: 3.5em;" id="revealIcon">✨</div>
            <div style="font-size: 1.8em; font-weight: 900; margin-top: 15px; text-shadow: 0 2px 5px #000;" id="revealName">캐릭터 명</div>
            <div style="font-size: 0.9em; margin-top: 8px; color: var(--gold);" id="revealType">5성 등급 캐릭터</div>
        </div>
        <button class="reveal-btn" onclick="dismissPremiumCutscene()">가챠 결과창 확인</button>
    </div>
</div>

<div id="nameModal" class="name-modal-overlay" style="display: none;">
    <div class="name-modal-box">
        <h3>🌌 여행자 등록</h3>
        <input type="text" id="modalNameInput" placeholder="닉네임 입력" maxlength="12" onkeydown="if(event.key === 'Enter') submitInitialName()">
        <button onclick="submitInitialName()">진입하기</button>
    </div>
</div>

<div class="wrapper">
    <div class="main-layout">
        <div class="container">
            <div class="dashboard">
                <div class="stat"><span>현재 스택</span><b id="dispPity">0</b></div>
                <div class="stat"><span>천장 여부</span><b id="dispGuaranteed">반천장</b></div>
                <div class="stat"><span>누적 원석</span><b id="dispGems">0</b></div>
                <div class="stat"><span>누적 결제액</span><b id="dispWon">₩ 0</b></div>
                <div class="stat" style="color:var(--chicken)"><span>치킨 지수 🍗</span><b id="dispChicken">0.0 마리</b></div>
            </div>
            
            <div id="stage" class="wish-stage">
                <div id="multiNoticeOverlay" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(5,10,21,0.85); z-index:999; display:none; justify-content:center; align-items:center; color:#aaa; font-weight:bold; font-size:1.2em; text-align:center;">
                    <span id="multiNoticeText">멀티방 참여 후 방장이 게임을 시작해야 기원이 가능합니다.</span>
                </div>
                <div id="effect-layer"></div>
                <div id="stage-placeholder" style="color: rgba(255,255,255,0.15); font-size: 1.1em; pointer-events: none; text-align: center; font-weight: bold;">
                    기원 버튼을 누르면 인연의 운석이 떨어집니다
                </div>
            </div>
            
            <div class="controls">
                <button id="btn1" onclick="handleWish(1)">1회 기원</button>
                <button id="btn10" onclick="handleWish(10)">10회 기원</button>
                <button id="btnSkip" class="btn-skip" onclick="revealAll()">결과 즉시 확인</button>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="panel-box">
                <h4 style="margin:0 0 8px 0; color:var(--blue);"> Warwick ⚔️ 실시간 멀티 대결 방</h4>
                <div class="input-group" id="roomControls">
                    <button id="btnCreateRoom" onclick="createRoom()" style="background:#28a745; color:white;">방 생성</button>
                    <input type="text" id="roomCodeInput" placeholder="방 코드 입력">
                    <button id="btnJoinRoom" onclick="joinRoom()" style="background:#6c757d; color:white;">참여</button>
                </div>
                <div id="activeRoomInfo" style="font-size:0.85em; color:var(--gold); margin-bottom:5px;"></div>
                <div id="gameStatusAlert">싱글 플레이어 모드</div>
                <div id="hostControlArea" style="display:none; margin-bottom:8px;">
                    <button onclick="startGame()" style="width:100%; background:crimson; color:white; padding:8px; border-radius:5px; font-weight:bold;">🎮 대결 시작하기</button>
                </div>
                <div id="roomUserList" class="room-user-list"></div>
            </div>

            <div class="panel-box">
                <h4 style="margin:0 0 8px 0; border-bottom:1px solid #223; padding-bottom:4px;">📜 실시간 가챠 기록</h4>
                <div id="historyList" class="history-list"></div>
            </div>
        </div>
    </div>

    <div class="gem-storage-panel">
        <h4 style="margin:0; color:var(--blue);">💎 인벤토리 원석 보관소</h4>
        <div class="gem-flex">
            <div class="gem-box">
                <div class="primogem-icon"></div>
                <span style="font-size:0.9em; color:#94a3b8;">소모된 총 뒤얽힌 인연:</span>
                <b style="font-size:1.3em; color:#fff; margin-left:5px;" id="invFates">0 개</b>
            </div>
            <div class="gem-box">
                <div class="primogem-icon" style="background:radial-gradient(circle, #ffe27c 0%, #f59e0b 70%); box-shadow:0 0 10px #f59e0b;"></div>
                <span style="font-size:0.9em; color:#94a3b8;">환산된 총 원석 데이터:</span>
                <b style="font-size:1.3em; color:var(--gold); margin-left:5px;" id="invGems">0 개</b>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore, collection, addDoc } from "firebase/firestore";
    import { getDatabase, ref, set, onValue, update, onDisconnect } from "firebase/database";

    const firebaseConfig = {
        apiKey: "AIzaSyCxj9RKhbsP04SESCfLNyp_QbIPssDXJFA",
        authDomain: "wish-1b853.firebaseapp.com",
        projectId: "wish-1b853",
        storageBucket: "wish-1b853.firebasestorage.app",
        messagingSenderId: "629417355340",
        appId: "1:629417355340:web:08f16592fc48bbfc14ace9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rdb = getDatabase(app);

    let savedStats = JSON.parse(localStorage.getItem('genshin_sim_stats'));
    let globalStats = savedStats || { pity5: 0, pity4: 0, totalPulls: 0, isGuaranteed: false, radianceStack: 0, results5: [] };
    
    const COST_PER_PULL = 2410;
    const CHICKEN_PRICE = 20000;
    
    let myName = localStorage.getItem('genshin_sim_name') || "";
    let currentRoomId = null;
    let isHost = false;
    let isMultiplayerMode = false;
    let isGameStarted = true;
    let cachedFiveStarResult = null; // 5성 연출 보관용 트래커

    window.handleWish = handleWish;
    window.revealAll = revealAll;
    window.flipCard = flipCard;
    window.submitInitialName = submitInitialName;
    window.createRoom = createRoom;
    window.joinRoom = joinRoom;
    window.startGame = startGame;
    window.dismissPremiumCutscene = dismissPremiumCutscene;

    window.onload = function() {
        if(!myName) {
            document.getElementById('nameModal').style.display = 'flex';
        } else {
            document.getElementById('btn1').disabled = false;
            document.getElementById('btn10').disabled = false;
            syncUI();
        }
    };

    function submitInitialName() {
        const input = document.getElementById('modalNameInput');
        if(!input || !input.value.trim()) return alert("사용할 이름을 입력해 주세요!");
        myName = input.value.trim();
        localStorage.setItem('genshin_sim_name', myName);
        document.getElementById('nameModal').style.display = 'none';
        document.getElementById('btn1').disabled = false;
        document.getElementById('btn10').disabled = false;
        syncUI();
    }

    function createRoom() {
        const roomId = Math.floor(100000 + Math.random() * 900000).toString();
        currentRoomId = roomId; isHost = true; isMultiplayerMode = true; isGameStarted = false;
        set(ref(rdb, `rooms/${roomId}/info`), { host: myName, status: "waiting" });
        document.getElementById('hostControlArea').style.display = 'block';
        document.getElementById('btn1').disabled = document.getElementById('btn10').disabled = true;
        
        const overlay = document.getElementById('multiNoticeOverlay');
        if(overlay) {
            document.getElementById('multiNoticeText').innerText = "대결 상대 대기 중...\n방장이 [대결 시작하기]를 누르면 배틀이 시작됩니다.";
            overlay.style.display = 'flex';
        }
        joinRoomSequence(roomId);
    }

    function joinRoom() {
        const codeInput = document.getElementById('roomCodeInput');
        if(!codeInput || !codeInput.value.trim()) return alert("방 코드를 입력해주세요.");
        currentRoomId = codeInput.value.trim(); isHost = false; isMultiplayerMode = true; isGameStarted = false;
        document.getElementById('btn1').disabled = document.getElementById('btn10').disabled = true;
        
        const overlay = document.getElementById('multiNoticeOverlay');
        if(overlay) {
            document.getElementById('multiNoticeText').innerText = "방장의 대결 시작 신호를 기다리고 있습니다...";
            overlay.style.display = 'flex';
        }
        joinRoomSequence(currentRoomId);
    }

    function joinRoomSequence(roomId) {
        document.getElementById('activeRoomInfo').innerText = `방 코드: ${roomId}`;
        document.getElementById('btnCreateRoom').disabled = document.getElementById('btnJoinRoom').disabled = document.getElementById('roomCodeInput').disabled = true;

        const myStatusRef = ref(rdb, `rooms/${roomId}/users/${myName}`);
        set(myStatusRef, { name: myName, pulls: globalStats.totalPulls, pity5: globalStats.pity5, lastUpdate: Date.now() });
        onDisconnect(myStatusRef).remove();

        onValue(ref(rdb, `rooms/${roomId}/info`), (snapshot) => {
            const info = snapshot.val(); if(!info) return;
            if(info.status === "playing" && !isGameStarted) {
                isGameStarted = true;
                document.getElementById('gameStatusAlert').innerText = "⚔️ 실시간 대결 진행 중! ⚔️";
                document.getElementById('gameStatusAlert').style.color = "crimson";
                document.getElementById('btn1').disabled = document.getElementById('btn10').disabled = false;
                document.getElementById('multiNoticeOverlay').style.display = 'none';
            }
        });

        onValue(ref(rdb, `rooms/${roomId}/users`), (snapshot) => {
            const users = snapshot.val(); const listContainer = document.getElementById('roomUserList');
            if(!listContainer || !users) return; listContainer.innerHTML = '';
            Object.keys(users).forEach(key => {
                const u = users[key]; const item = document.createElement('div');
                item.className = 'room-user-item';
                item.innerHTML = `<span>👤 ${u.name}</span><span>${u.pulls}뽑 <b style="color:var(--blue)">(${u.pity5}스택)</b></span>`;
                listContainer.appendChild(item);
            });
        });
    }

    function startGame() { if(isHost && currentRoomId) update(ref(rdb, `rooms/${currentRoomId}/info`), { status: "playing" }); }
    function syncMultiplayerStatus() { if (!isMultiplayerMode || !currentRoomId) return; update(ref(rdb, `rooms/${currentRoomId}/users/${myName}`), { name: myName, pulls: globalStats.totalPulls, pity5: globalStats.pity5, lastUpdate: Date.now() }); }

    function handleWish(count) {
        const stage = document.getElementById('stage'), effectLayer = document.getElementById('effect-layer');
        const btn1 = document.getElementById('btn1'), btn10 = document.getElementById('btn10');
        const placeholder = document.getElementById('stage-placeholder');
        
        if(placeholder) placeholder.style.display = 'none';
        Array.from(stage.querySelectorAll('.card')).forEach(c => c.remove());
        effectLayer.innerHTML = ''; btn1.disabled = btn10.disabled = true;

        const results = Array.from({length: count}, calculateOne);
        const maxRank = Math.max(...results.map(r => r.rank));

        const star = document.createElement('div');
        star.className = `shooting-star star-${maxRank}`;
        effectLayer.appendChild(star);

        // 5성이 존재하면 스킵 버튼 자체를 원천 봉쇄
        if (maxRank === 5) {
            document.getElementById('btnSkip').style.display = 'none';
            cachedFiveStarResult = results.find(r => r.rank === 5);
        } else {
            setTimeout(() => { document.getElementById('btnSkip').style.display = 'block'; }, 1500);
        }

        setTimeout(() => showCards(results, count), (maxRank === 5 ? 2900 : 1600));
    }

    function calculateOne() {
        let res = { rank: 3, name: "3성 무기", isRadiance: false, stack: 0, isPickup: false };
        let chance = 0.6 + (globalStats.pity5 >= 74 ? (globalStats.pity5 - 73) * 6 : 0);
        globalStats.pity5++; globalStats.totalPulls++; globalStats.pity4++;
        
        if (Math.random() * 100 < chance || globalStats.pity5 >= 90) {
            res.rank = 5; res.stack = globalStats.pity5;
            let win = false;
            
            if (globalStats.isGuaranteed) { win = true; globalStats.isGuaranteed = false; }
            else {
                let radChance = (globalStats.radianceStack === 0) ? 5 : (globalStats.radianceStack === 1 ? 10 : 100);
                if (Math.random() * 100 < 50) win = true;
                else if (Math.random() * 100 < radChance) { win = true; res.isRadiance = true; }
                else { win = false; globalStats.isGuaranteed = true; globalStats.radianceStack++; }
            }
            res.isPickup = win;
            globalStats.pity5 = 0;
        } else if (Math.random() * 100 < 5.1 || globalStats.pity4 >= 10) {
            res.rank = 4; res.name = "4성 캐릭터"; globalStats.pity4 = 0;
        }
        return res;
    }

    function showCards(results, count) {
        const stage = document.getElementById('stage'); if(!stage) return;
        results.forEach((res, i) => {
            const card = document.createElement('div'); card.className = `card`;
            if(count === 1) card.style.maxWidth = "200px";
            card.innerHTML = `<div class="card-inner">
                <div class="card-back" onclick="flipCard(this, ${JSON.stringify(res)})"></div>
                <div class="card-front res-${res.rank}">
                    <div style="font-size:0.6em;">${'✦'.repeat(res.rank)}</div>
                    <div style="font-size:0.85em; padding:5px;">${res.rank === 5 ? (res.isPickup ? '픽업 캐릭터' : '상시 캐릭터') : res.name}</div>
                </div>
            </div>`;
            stage.appendChild(card);
            setTimeout(() => card.classList.add('active'), i * 40);
        });
    }

    function flipCard(el, res) {
        const card = el.closest('.card'); if(!card || card.classList.contains('flipped')) return;
        
        // 🌟 5성 클릭 시 즉시 하이라이트 영화적 연출 트리거 전개
        if(res.rank === 5) {
            triggerPremiumCutscene(res, card);
            return;
        }

        executeCardFlipLogic(card, res);
    }

    function executeCardFlipLogic(card, res) {
        card.classList.add('flipped');
        if(res.rank === 5) { 
            globalStats.results5.push(res); 
            updateHistory(res); 
        }
        localStorage.setItem('genshin_sim_stats', JSON.stringify(globalStats));
        syncUI();
        syncMultiplayerStatus();
        checkDone();
    }

    /* 🎬 하이엔드 5성 강제 암전 & 실루엣 폭발 비주얼 연출 소스 */
    function triggerPremiumCutscene(res, cardTarget) {
        const overlay = document.getElementById('premiumCutscene');
        const sil = document.getElementById('silhouetteActor');
        const rev = document.getElementById('revealActor');
        const frame = document.getElementById('showcaseFrame');
        const nameText = document.getElementById('revealName');
        const typeText = document.getElementById('revealType');
        const iconArea = document.getElementById('revealIcon');

        // 초기 무대 세팅 (암전)
        overlay.style.display = 'flex';
        sil.style.display = 'block';
        rev.style.style = 'none';
        rev.classList.remove('pop-open');
        frame.className = "showcase-frame";

        // 0.5초 실루엣 스테이지 진행 후 스파크 결정 분출
        setTimeout(() => {
            sil.style.display = 'none';
            
            // 크리스탈 결정 파편 80개 생성 및 무작위 비산 가동
            for (let i = 0; i < 80; i++) {
                const particle = document.createElement('div');
                particle.className = 'crystal-particle';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = 150 + Math.random() * 400;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                
                particle.style.setProperty('--x', `${x}px`);
                particle.style.setProperty('--y', `${y}px`);
                particle.style.left = '50%';
                particle.style.top = '50%';
                
                // 등급 타입에 매칭되는 이펙트 애니메이션 적용
                particle.style.animation = `${res.isPickup ? 'scatter-pickup' : 'scatter-standard'} ${0.6 + Math.random() * 0.6}s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
                overlay.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }

            // 캐릭터 결과 공개창 띄우기 및 배경 색 반전 체인지
            rev.style.display = 'flex';
            rev.classList.add('pop-open');
            
            if(res.isPickup) {
                frame.classList.add('bg-pickup-reveal');
                nameText.innerText = "5성 한정 픽업 캐릭터";
                typeText.innerText = "🏆 기원 목표 저격 대성공!";
                iconArea.innerText = "👑";
            } else {
                frame.classList.add('bg-standard-reveal');
                nameText.innerText = "5성 상시 캐릭터";
                typeText.innerText = "🐱 아련함이 몰려오는 픽뚫 발생";
                iconArea.innerText = "💫";
            }

            // 트래커 데이터 바인딩 저장 준비
            cachedFiveStarResult = { card: cardTarget, data: res };

        }, 550);
    }

    function dismissPremiumCutscene() {
        document.getElementById('premiumCutscene').style.display = 'none';
        if(cachedFiveStarResult && cachedFiveStarResult.card) {
            executeCardFlipLogic(cachedFiveStarResult.card, cachedFiveStarResult.data);
            cachedFiveStarResult = null;
        }
    }

    function syncUI() {
        const totalWon = globalStats.totalPulls * COST_PER_PULL;
        document.getElementById('dispPity').innerText = globalStats.pity5;
        document.getElementById('dispGuaranteed').innerText = globalStats.isGuaranteed ? "확정권" : "반천장";
        document.getElementById('dispGems').innerText = (globalStats.totalPulls * 160).toLocaleString();
        document.getElementById('dispWon').innerText = "₩ " + totalWon.toLocaleString();
        document.getElementById('dispChicken').innerText = (totalWon / CHICKEN_PRICE).toFixed(1) + " 마리";
        
        // 💎 하단 원석 인벤토리 보관소 정보 실시간 동기화
        document.getElementById('invFates').innerText = globalStats.totalPulls.toLocaleString() + " 개";
        document.getElementById('invGems').innerText = (globalStats.totalPulls * 160).toLocaleString() + " 개";
    }

    function updateHistory(res) {
        const list = document.getElementById('historyList'); if(!list) return;
        const item = document.createElement('div'); item.style.padding = "5px 0"; item.style.borderBottom = "1px solid #1f2736";
        const color = res.isPickup ? 'var(--gold)' : '#888';
        item.innerHTML = `<span style="color:${color}">${res.isPickup ? '★5 픽업 캐릭터' : '★5 상시 캐릭터'}</span> <span style="float:right; color:#666;">${res.stack}스택</span>`;
        list.prepend(item);
    }

    function revealAll() { 
        document.querySelectorAll('.card:not(.flipped) .card-back').forEach((c, i) => setTimeout(() => c.click(), i * 35)); 
    }
    
    function checkDone() {
        const total = document.querySelectorAll('.card').length, flipped = document.querySelectorAll('.card.flipped').length;
        if (total > 0 && total === flipped) {
            document.getElementById('btnSkip').style.display = 'none';
            if(isGameStarted) { document.getElementById('btn1').disabled = document.getElementById('btn10').disabled = false; }
        }
    }
</script>
