<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기원</title>
<style>
    /* 기본 배경 및 레이아웃 */
    body {
        background-color: #1a1a2e;
        color: #fff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        overflow-x: hidden;
        margin: 0;
        padding: 20px;
    }

    /* 버튼 스타일 */
    .btn-group {
        position: relative;
        z-index: 20;
        margin-bottom: 30px;
    }
    button {
        background: #e9e5dc;
        border: none;
        padding: 10px 20px;
        margin: 0 10px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.2s;
    }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    button:hover:not(:disabled) { transform: scale(1.05); }

    /* 연출 레이어 및 무대 */
    #effect-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #stage { 
        display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
        max-width: 800px; margin: 0 auto; position: relative; z-index: 15; 
        transition: opacity 0.5s;
    }
    .stage-dimmed { opacity: 0.3; }
    #stage-placeholder { color: #888; font-size: 1.2em; padding: 50px; }

    /* 카드 스타일 및 애니메이션 */
    .card {
        width: 120px; height: 180px;
        perspective: 1000px; /* 3D 효과를 위한 원근감 */
        opacity: 0; transform: translateY(30px) scale(0.9);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .card.active { opacity: 1; transform: translateY(0) scale(1); }
    
    .card-inner {
        width: 100%; height: 100%;
        position: relative;
        transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
        width: 100%; height: 100%;
        position: absolute; top: 0; left: 0;
        backface-visibility: hidden;
        border-radius: 8px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    
    .card-back {
        background: linear-gradient(135deg, #2c3e50, #3498db);
        border: 2px solid #5da5e8;
        cursor: pointer; /* 클릭 유도 */
    }
    .card-back::after { content: "Click!"; font-size: 0.8em; color: rgba(255,255,255,0.7); }
    
    .card-front {
        transform: rotateY(180deg);
        color: #333; font-weight: bold; padding: 10px; box-sizing: border-box; text-align: center;
    }

    /* 등급별 카드 색상 */
    .res-3 { background: linear-gradient(135deg, #74b9ff, #0984e3); color: white; }
    .res-4 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; }
    .res-5 { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #555; }
    .res-rad { background: linear-gradient(135deg, #ff7675, #d63031); color: white; box-shadow: 0 0 15px #d63031;}

    /* 유성 애니메이션 (단순화된 예시) */
    .shooting-star {
        position: absolute; top: -10%; left: 50%;
        width: 8px; height: 8px; border-radius: 50%; background: white;
        box-shadow: 0 0 20px 5px white;
        animation: fall 1s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    .star-4 { background: #a29bfe; box-shadow: 0 0 20px 5px #a29bfe; }
    .star-5 { background: #fdcb6e; box-shadow: 0 0 20px 5px #fdcb6e; }
    .star-rad { background: #ff7675; box-shadow: 0 0 20px 5px #ff7675; animation-duration: 1.5s; }
    
    @keyframes fall {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(-200px, 600px) scale(0); opacity: 0; }
    }

    /* 플래시 효과 레이어 */
    #flash-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 30;
    }
</style>
</head>
<body>

<div id="flash-overlay"></div>

<div class="btn-group">
    <button id="btn1">1회 기원</button>
    <button id="btn10">10회 기원</button>
    <button id="btnSkip" style="display:none; background:#ff7675; color:white;">스킵</button>
</div>

<div id="effect-layer"></div>

<div id="stage">
    <div id="stage-placeholder">기원 버튼을 눌러주세요.</div>
</div>

<script type="module">
    // --- 1. 확률 계산 및 모의 데이터 생성 함수 ---
    function calculateOne() {
        const rand = Math.random();
        let rank = 3, isRadiance = false, name = "3성 무기", isPickup = false, constLevel = "";

        if (rand < 0.006) {
            rank = 5; name = "5성 한정 캐릭터";
            isPickup = Math.random() > 0.5;
            if (isPickup) constLevel = "픽업!";
            if (Math.random() < 0.1) isRadiance = true; 
        } else if (rand < 0.057) {
            rank = 4; name = "4성 캐릭터";
        }
        return { rank, isRadiance, name, isPickup, constLevel };
    }

    // --- 2. 유틸리티 함수 (화면 플래시, 카드 뒤집기) ---
    function triggerFlash(color, maxOpacity) {
        const flash = document.getElementById('flash-overlay');
        flash.style.backgroundColor = color;
        flash.style.opacity = maxOpacity;
        setTimeout(() => { flash.style.opacity = '0'; }, 300);
    }

    function flipCard(cardBackElement, res) {
        // closest()를 이용해 클릭된 카드의 최상위 요소를 찾아 뒤집기 애니메이션 클래스 추가
        const card = cardBackElement.closest('.card');
        if (card && !card.classList.contains('flipped')) {
            card.classList.add('flipped');
        }
    }

    // --- 3. 기원 버튼 핸들러 (애니메이션 동기화 수정 완료) ---
    function handleWish(count) {
        const stage = document.getElementById('stage');
        const effectLayer = document.getElementById('effect-layer');
        const btn1 = document.getElementById('btn1');
        const btn10 = document.getElementById('btn10');
        const placeholder = document.getElementById('stage-placeholder');
        
        if(placeholder) placeholder.style.display = 'none';
        
        // 기존 카드 초기화
        Array.from(stage.querySelectorAll('.card')).forEach(c => c.remove());
        effectLayer.innerHTML = ''; 
        
        // 연출 중 버튼 비활성화
        btn1.disabled = btn10.disabled = true;

        // 결과 생성
        const results = Array.from({length: count}, calculateOne);
        const maxRank = Math.max(...results.map(r => r.rank));
        const hasRad = results.some(r => r.isRadiance);

        // 유성 생성
        const star = document.createElement('div');
        star.className = `shooting-star ${hasRad ? 'star-rad' : 'star-'+maxRank}`;
        effectLayer.appendChild(star);
        
        // 플래시 및 파동 연출 타이밍 조절
        if (maxRank === 4) setTimeout(() => triggerFlash('#a29bfe', 0.5), 800);
        else if (maxRank === 5 || hasRad) setTimeout(() => triggerFlash('#ffffff', 0.8), 900);
        
        // CSS 애니메이션 시간에 맞춘 대기 시간 설정 (임의 단축 시간)
        const animTimes = { 'star-3': 1000, 'star-4': 1000, 'star-5': 1000, 'star-rad': 1500 };
        const totalWaitTime = (hasRad ? animTimes['star-rad'] : animTimes['star-'+maxRank]) + 100;

        // [핵심 수정] 연출이 끝난 후 카드 렌더링 호출
        setTimeout(() => {
            showCards(results, count);
            btn1.disabled = btn10.disabled = false; // 버튼 다시 활성화
        }, totalWaitTime);
    }

    // --- 4. 카드 화면 출력 함수 (이벤트 바인딩 수정 완료) ---
    function showCards(results, count) {
        const stage = document.getElementById('stage');
        if(!stage) return;
        document.getElementById('btnSkip').style.display = 'block';
        
        results.forEach((res, i) => {
            const card = document.createElement('div'); 
            card.className = `card`;
            
            // 1회 기원일 경우 카드를 조금 더 크게 표시 (선택사항)
            if(count === 1) {
                card.style.width = "200px";
                card.style.height = "300px";
            }
            
            // 인라인 onclick 대신 순수 HTML 구조만 작성
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-back"></div>
                    <div class="card-front res-${res.isRadiance ? 'rad' : res.rank}">
                        <div style="font-size: ${count === 1 ? '1.2em' : '0.8em'};">
                            ${'✦'.repeat(res.rank)}
                        </div>
                        <div style="margin-top: 10px;">${res.name}</div>
                        ${res.isPickup ? `
                            <div style="font-size:0.8em; margin-top:10px; color:#d32f2f; background:rgba(255,255,255,0.7); border-radius:10px; padding:4px 8px; display:inline-block; font-weight:bold;">
                                ${res.constLevel}
                            </div>
                        ` : ''}
                    </div>
                </div>`;
            
            // [핵심 수정] 안전한 이벤트 리스너 부착 방식
            const cardBack = card.querySelector('.card-back');
            cardBack.addEventListener('click', () => {
                flipCard(cardBack, res);
            });

            stage.appendChild(card);
            
            // 카드가 순차적으로 나타나는 효과
            setTimeout(() => card.classList.add('active'), i * 80);
        });
    }

    // --- 5. 버튼 이벤트 연결 ---
    document.getElementById('btn1').addEventListener('click', () => handleWish(1));
    document.getElementById('btn10').addEventListener('click', () => handleWish(10));
    document.getElementById('btnSkip').addEventListener('click', () => {
        // 스킵 로직 작성 (예: 현재 연출 중지 및 모든 카드 즉시 표시/뒤집기)
        alert('스킵 기능은 아직 구현되지 않았습니다!');
    });
</script>

</body>
</html>
